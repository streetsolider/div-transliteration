<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ތަރުޖަމާނު | Dhivehi Transliteration</title>
    <style>
        /* Local Thaana fonts */
        @font-face {
            font-family: 'Faruma';
            src: url('/static/fonts/Faruma.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'Bolhu';
            src: url('/static/fonts/Bolhu-Bold.ttf') format('truetype');
            font-weight: 700;
        }

        :root {
            --primary: #0d9488;
            --primary-hover: #0f766e;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --error: #ef4444;
            --success: #22c55e;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 1.25rem 1rem;
            text-align: center;
        }

        .header h1 {
            font-family: 'Bolhu', 'Faruma', sans-serif;
            font-weight: 700;
            font-size: 1.75rem;
            margin-bottom: 0.25rem;
            background: linear-gradient(135deg, #0d9488 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .main-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            flex: 1;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            border-radius: 1rem;
            box-shadow: var(--shadow-lg);
            padding: 2rem;
            border: 1px solid var(--border);
        }

        .io-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 768px) {
            .io-grid {
                grid-template-columns: 1fr;
            }
        }

        .section-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .section-label span {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .word-count {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 1.25rem;
            font-size: 1.1rem;
            border: 1.5px solid var(--border);
            border-radius: 0.75rem;
            resize: none;
            transition: all 0.2s;
            font-family: inherit;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.12);
        }

        .thaana-output {
            background-color: #fcfcfc;
        }

        /* Applied to any element holding Thaana script (textareas, example pills, etc.) */
        .is-thaana {
            direction: rtl;
            text-align: right;
            font-family: 'Faruma', sans-serif;
        }
        textarea.is-thaana {
            font-size: 1.25rem;
            line-height: 1.8;
        }

        /* Direction toggle */
        .direction-toggle {
            display: inline-flex;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 3px;
            margin-bottom: 1.5rem;
        }
        .dir-btn {
            padding: 0.4rem 1rem;
            font-size: 0.85rem;
            font-weight: 500;
            background: transparent;
            color: var(--text-muted);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .dir-btn.active {
            background: white;
            color: var(--primary);
            box-shadow: var(--shadow);
        }
        .toggle-row {
            display: flex;
            justify-content: center;
            margin-bottom: 0.5rem;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
        }

        @media (max-width: 640px) {
            .header {
                padding: 1.5rem 1rem;
            }
            .header h1 {
                font-size: 2rem;
            }
            .card {
                padding: 1.25rem;
                border-radius: 0.75rem;
            }
            textarea {
                height: 200px;
                padding: 1rem;
                font-size: 1rem;
            }
            textarea.is-thaana {
                font-size: 1.15rem;
            }
            .actions {
                flex-direction: column;
            }
            button {
                width: 100%;
            }
            .examples-grid {
                grid-template-columns: 1fr;
            }
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 2rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-size: 1rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }

        .btn-stop {
            background: var(--error);
            color: white;
        }

        .btn-copy {
            background: white;
            color: var(--text-main);
            border: 1px solid var(--border);
            width: 36px;
            height: 36px;
            padding: 0;
            border-radius: 0.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .btn-copy:hover {
            background: var(--bg);
            border-color: var(--primary);
            color: var(--primary);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Examples Section */
        .examples-section {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }

        .examples-section h3 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .examples-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }

        .example-pill {
            background: white;
            border: 1px solid var(--border);
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            text-align: left;
        }

        .example-pill:hover {
            border-color: var(--primary);
            background: rgba(13, 148, 136, 0.04);
            color: var(--primary);
        }

        .example-pill.is-thaana {
            text-align: right;
        }

        /* Progress & Loading */
        .progress-container {
            margin-top: 1.5rem;
            display: none;
        }

        .progress-container.active {
            display: block;
        }

        .progress-bar-bg {
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .status-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
        }

        /* Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.4s;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #1e293b;
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 0.5rem;
            box-shadow: var(--shadow-lg);
            display: none;
            z-index: 1001;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border);
            background: white;
            font-family: 'Faruma', sans-serif;
        }

        .thaana-output.streaming {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Custom Scrollbar */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: transparent;
        }
        textarea::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="overlay" id="warmupOverlay">
        <div class="spinner"></div>
        <h2 style="margin-bottom: 0.5rem;">Preparing Tharjumanu...</h2>
        <p style="color: var(--text-muted);">Loading AI model. This takes about 30 seconds on first run.</p>
    </div>

    <header class="header">
        <h1>ލެޓިން ތަރުޖަމާނު</h1>
        <p>AI-Powered Latin to Thaana Transliteration</p>
    </header>

    <main class="main-container">
        <div class="card">
            <div class="toggle-row">
                <div class="direction-toggle" id="directionToggle">
                    <button class="dir-btn active" data-dir="latin2thaana">Latin → Thaana</button>
                    <button class="dir-btn" data-dir="thaana2latin">Thaana → Latin</button>
                </div>
            </div>
            <div class="io-grid">
                <div class="input-pane">
                    <div class="section-label">
                        <span id="inputLabel">Latin Dhivehi</span>
                        <span class="word-count" id="wordCount">0 / 750 words</span>
                    </div>
                    <textarea id="latinInput" placeholder="Type or paste Latin Dhivehi here..."></textarea>
                </div>

                <div class="output-pane">
                    <div class="section-label">
                        <span id="outputLabel">Thaana Output</span>
                        <button id="copyBtn" class="btn-copy" style="display: none;" onclick="copyOutput()" title="Copy to clipboard">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        </button>
                    </div>
                    <textarea id="thaanaOutput" class="thaana-output is-thaana" readonly placeholder="ތާނަ އައުޓްޕުޓް މިތަނުން ފެންނާނެ..."></textarea>
                </div>
            </div>

            <div class="actions">
                <button id="transBtn" class="btn-primary" onclick="startTransliteration()" disabled>
                    Transliterate
                </button>
                <button id="stopBtn" class="btn-stop" style="display: none;" onclick="stopTransliteration()">
                    Stop
                </button>
            </div>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>
                <div class="status-text" id="statusText">Processing...</div>
            </div>

            <div class="examples-section">
                <h3>Try an example</h3>
                <div class="examples-grid" id="examplesGrid"></div>
            </div>
        </div>
    </main>

    <div id="errorToast" class="error-toast"></div>

    <footer class="footer">
        <p>&copy; 2026 ލެޓިން ތަރުޖަމާނު</p>
    </footer>

    <script>
        const latinInput = document.getElementById('latinInput');
        const thaanaOutput = document.getElementById('thaanaOutput');
        const transBtn = document.getElementById('transBtn');
        const stopBtn = document.getElementById('stopBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const wordCount = document.getElementById('wordCount');
        const copyBtn = document.getElementById('copyBtn');
        const warmupOverlay = document.getElementById('warmupOverlay');
        const errorToast = document.getElementById('errorToast');
        const directionToggle = document.getElementById('directionToggle');
        const examplesGrid = document.getElementById('examplesGrid');

        const MAX_WORDS = 750;
        let currentReader = null;
        let direction = 'latin2thaana';

        const DIRECTION_CONFIG = {
            latin2thaana: {
                inputLabel: 'Latin Dhivehi',
                outputLabel: 'Thaana Output',
                inputPlaceholder: 'Type or paste Latin Dhivehi here...',
                outputPlaceholder: 'ތާނަ އައުޓްޕުޓް މިތަނުން ފެންނާނެ...',
                inputIsThaana: false,
                examples: [
                    'Kihinehtha? Aharennakee Dhivehi bahun liyan dhaskuraa kujjeh.',
                    'Dhivehiraajjeyge ufehdhuntherikan ithurukuran masakaiy kurumakee emmege vaajibekeve.',
                    'Maadhanu noon aneh dhuvahu mi buraasfathi dhuvas haassa dhuvahakah hedhumah thiya beyfulhunnaa gulhigen masakaiy kuraanan.',
                ],
            },
            thaana2latin: {
                inputLabel: 'Thaana',
                outputLabel: 'Latin Output',
                inputPlaceholder: 'ތާނަ ޓެކްސްޓް މިތަނުގައި ލިޔޭ...',
                outputPlaceholder: 'Latin output will appear here...',
                inputIsThaana: true,
                examples: [
                    'ކިހިނެއްތަ؟ އަހަރެންނަކީ ދިވެހި ބަހުން ލިޔަން ދަސްކުރާ ކުއްޖެއް.',
                    'ދިވެހިރާއްޖޭގެ އުފެއްދުންތެރިކަން އިތުރުކުރަން މަސައްކަތް ކުރުމަކީ އެންމެގެ ވާޖިބެކެވެ.',
                    'މާދަން ނޫން އަނެއް ދުވަހު މި ބުރާސްފަތި ދުވަސް ޚާއްސަ ދުވަހަކަށް ހެދުމަށް ތިޔަ ބޭފުޅުންނާ ގުޅިގެން މަސައްކަތް ކުރާނަން.',
                ],
            },
        };

        function applyDirection() {
            const cfg = DIRECTION_CONFIG[direction];
            document.getElementById('inputLabel').textContent = cfg.inputLabel;
            document.getElementById('outputLabel').textContent = cfg.outputLabel;
            latinInput.placeholder = cfg.inputPlaceholder;
            thaanaOutput.placeholder = cfg.outputPlaceholder;
            latinInput.classList.toggle('is-thaana', cfg.inputIsThaana);
            thaanaOutput.classList.toggle('is-thaana', !cfg.inputIsThaana);

            latinInput.value = '';
            thaanaOutput.value = '';
            copyBtn.style.display = 'none';

            examplesGrid.innerHTML = '';
            for (const ex of cfg.examples) {
                const pill = document.createElement('div');
                pill.className = 'example-pill';
                if (cfg.inputIsThaana) {
                    pill.classList.add('is-thaana');
                    pill.style.fontSize = '1rem';
                }
                pill.textContent = ex;
                pill.onclick = () => loadExample(ex);
                examplesGrid.appendChild(pill);
            }

            for (const btn of directionToggle.querySelectorAll('.dir-btn')) {
                btn.classList.toggle('active', btn.dataset.dir === direction);
            }

            updateUI();
        }

        directionToggle.addEventListener('click', (e) => {
            const btn = e.target.closest('.dir-btn');
            if (!btn || btn.dataset.dir === direction) return;
            direction = btn.dataset.dir;
            applyDirection();
        });

        // --- Core Functions ---

        function updateUI() {
            const text = latinInput.value.trim();
            const words = text ? text.split(/\s+/).length : 0;
            wordCount.textContent = `${words} / ${MAX_WORDS} words`;

            if (words > MAX_WORDS) {
                wordCount.style.color = 'var(--error)';
                transBtn.disabled = true;
            } else {
                wordCount.style.color = 'var(--text-muted)';
                if (warmupOverlay.classList.contains('hidden')) {
                    transBtn.disabled = !text;
                }
            }
        }

        function loadExample(text) {
            latinInput.value = text;
            updateUI();
            latinInput.focus();
        }

        function showError(msg) {
            errorToast.textContent = `⚠️ ${msg}`;
            errorToast.style.display = 'block';
            setTimeout(() => {
                errorToast.style.display = 'none';
            }, 5000);
        }

        async function copyOutput() {
            try {
                await navigator.clipboard.writeText(thaanaOutput.value);
                const originalHTML = copyBtn.innerHTML;
                copyBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
                copyBtn.style.borderColor = 'var(--success)';
                setTimeout(() => {
                    copyBtn.innerHTML = originalHTML;
                    copyBtn.style.borderColor = '';
                }, 2000);
            } catch (err) {
                showError('Failed to copy text');
            }
        }

        async function startTransliteration() {
            const text = latinInput.value.trim();
            if (!text) return;

            // Reset UI
            thaanaOutput.value = '';
            thaanaOutput.classList.add('streaming');
            progressContainer.classList.add('active');
            transBtn.style.display = 'none';
            stopBtn.style.display = 'inline-flex';
            copyBtn.style.display = 'none';
            progressBar.style.width = '0%';
            statusText.textContent = 'Starting engine...';

            try {
                const response = await fetch('/transliterate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, direction })
                });

                const reader = response.body.getReader();
                currentReader = reader;
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = JSON.parse(line.substring(6));

                            if (data.error) {
                                showError(data.error);
                                cleanup();
                                return;
                            }

                            if (data.status) statusText.textContent = data.status;
                            if (data.progress !== undefined) progressBar.style.width = `${data.progress}%`;

                            if (data.thaana) {
                                thaanaOutput.value = data.thaana;
                                copyBtn.style.display = 'inline-flex';
                                // Scroll to bottom of textarea
                                thaanaOutput.scrollTop = thaanaOutput.scrollHeight;
                            }

                            if (data.partial === false) {
                                progressBar.style.width = '100%';
                                statusText.textContent = 'Complete!';
                                setTimeout(cleanup, 500);
                            }
                        }
                    }
                }
            } catch (err) {
                showError('Network error occurred');
                cleanup();
            }
        }

        function stopTransliteration() {
            if (currentReader) {
                currentReader.cancel();
                currentReader = null;
            }
            statusText.textContent = 'Stopped';
            cleanup();
        }

        function cleanup() {
            transBtn.style.display = 'inline-flex';
            stopBtn.style.display = 'none';
            thaanaOutput.classList.remove('streaming');
            currentReader = null;
            setTimeout(() => {
                if (!currentReader) progressContainer.classList.remove('active');
            }, 3000);
        }

        // --- Init ---

        async function checkReady() {
            while (true) {
                try {
                    const res = await fetch('/ready');
                    if (res.ok) {
                        warmupOverlay.classList.add('hidden');
                        updateUI();
                        break;
                    }
                } catch (e) {}
                await new Promise(r => setTimeout(r, 2000));
            }
        }

        latinInput.addEventListener('input', updateUI);
        window.addEventListener('load', () => {
            applyDirection();
            checkReady();
        });
    </script>
</body>
</html>
