version: '3.8'

services:
  transliteration:
    build: .
    container_name: dhivehi-transliteration
    ports:
      - "5001:5001"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    # Resource limits (adjust based on your server)
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    healthcheck:
      # python, not curl: python:3.9-slim ships no curl, so a curl test fails
      # every time. Compose ignores that; Swarm kills and reschedules the task.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
