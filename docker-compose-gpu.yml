version: '3.8'

services:
  transliteration:
    build:
      context: .
      args:
        # Dockerfile defaults to the CPU torch wheel; GPU needs the CUDA 12.8 build.
        TORCH_VARIANT: cu128
    container_name: dhivehi-transliteration-gpu
    ports:
      - "5001:5001"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    # GPU configuration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      # python, not curl: python:3.9-slim ships no curl, so a curl test fails
      # every time. Compose ignores that; Swarm kills and reschedules the task.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
